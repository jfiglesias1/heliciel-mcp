<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <title>Heliciel MCP — how it works</title>
  <desc>An AI assistant sends a plain-language request to the Heliciel MCP server, which drives the Heliciel design software and returns computed results.</desc>

  <defs>
    <marker id="fleche-bleu" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2c6fb5"/>
    </marker>
    <marker id="fleche-vert" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2e8b45"/>
    </marker>
  </defs>

  <rect width="1500" height="1010" fill="#ffffff"/>

  <!-- ================= Titre ================= -->
  <text x="750" y="62" text-anchor="middle" font-size="42" font-weight="700" fill="#12365f" letter-spacing="1">HELICIEL MCP</text>
  <text x="750" y="100" text-anchor="middle" font-size="21" fill="#42607f">Access the power of Heliciel through your AI</text>

  <!-- ================= Colonne 1 : utilisateur ================= -->
  <rect x="40" y="140" width="330" height="620" rx="14" fill="#f5f9fd" stroke="#c2d8ec" stroke-width="1.5"/>
  <text x="205" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#1a4f8a" letter-spacing="1">USER / AI</text>
  <text x="205" y="212" text-anchor="middle" font-size="15" fill="#5b7897">AI chat or assistant</text>

  <!-- pictogramme : tete + circuit -->
  <g transform="translate(205,285)" stroke="#1a4f8a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-34,34 C-52,10 -46,-26 -18,-38 C8,-49 38,-33 40,-6 C41,10 34,20 34,34"/>
    <path d="M-34,34 L-34,44 L34,44 L34,34"/>
    <circle cx="-6" cy="-14" r="5" fill="#1a4f8a" stroke="none"/>
    <circle cx="18" cy="-2" r="5" fill="#1a4f8a" stroke="none"/>
    <circle cx="-14" cy="12" r="5" fill="#1a4f8a" stroke="none"/>
    <path d="M-6,-14 L18,-2 M-6,-14 L-14,12 M18,-2 L-14,12"/>
  </g>

  <!-- bulle : requete -->
  <rect x="66" y="360" width="278" height="126" rx="12" fill="#dcebf9"/>
  <path d="M92,486 L92,506 L114,486 Z" fill="#dcebf9"/>
  <text font-size="15.5" fill="#173d63">
    <tspan x="86" y="388">"Design a 4-blade propeller,</tspan>
    <tspan x="86" y="412">1.2 m diameter, 8000 N of thrust</tspan>
    <tspan x="86" y="436">at 5 m/s in fresh water."</tspan>
  </text>
  <text x="86" y="468" font-size="13" fill="#5b7897" font-style="italic">plain language, no syntax to learn</text>

  <!-- bulle : reponse -->
  <rect x="66" y="536" width="278" height="104" rx="12" fill="#dff0e2"/>
  <path d="M92,640 L92,660 L114,640 Z" fill="#dff0e2"/>
  <text font-size="15.5" fill="#194d2c">
    <tspan x="86" y="566">Propeller designed.</tspan>
    <tspan x="86" y="590">Here is the Heliciel project,</tspan>
    <tspan x="86" y="614">with its computed performance.</tspan>
  </text>

  <!-- coche -->
  <g transform="translate(205,700)">
    <circle r="26" fill="none" stroke="#2e8b45" stroke-width="2.6"/>
    <path d="M-11,1 L-3,10 L12,-9" fill="none" stroke="#2e8b45" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="205" y="790" text-anchor="middle" font-size="14.5" fill="#5b7897">Plain-language request</text>
  <text x="205" y="812" text-anchor="middle" font-size="14.5" fill="#5b7897">Structured response</text>

  <!-- ================= Fleches gauche ================= -->
  <line x1="378" y1="330" x2="432" y2="330" stroke="#2c6fb5" stroke-width="3" marker-end="url(#fleche-bleu)"/>
  <text x="405" y="308" text-anchor="middle" font-size="14.5" fill="#2c6fb5" font-weight="600">Request</text>
  <text x="405" y="358" text-anchor="middle" font-size="12.5" fill="#6b86a3">natural language</text>

  <line x1="432" y1="560" x2="378" y2="560" stroke="#2e8b45" stroke-width="3" marker-end="url(#fleche-vert)"/>
  <text x="405" y="538" text-anchor="middle" font-size="14.5" fill="#2e8b45" font-weight="600">Response</text>
  <text x="405" y="588" text-anchor="middle" font-size="12.5" fill="#6b86a3">structured data</text>

  <!-- ================= Colonne 2 : service MCP ================= -->
  <rect x="440" y="140" width="450" height="620" rx="14" fill="#f4fbf5" stroke="#b9dcc2" stroke-width="1.5"/>
  <text x="665" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#22703a" letter-spacing="0.5">HELICIEL MCP SERVICE</text>
  <text x="665" y="212" text-anchor="middle" font-size="15" fill="#5f8a6d">MCP server, local or remote</text>

  <!-- hexagone + helice -->
  <g transform="translate(665,318)">
    <path d="M0,-84 L73,-42 L73,42 L0,84 L-73,42 L-73,-42 Z" fill="#ffffff" stroke="#2e8b45" stroke-width="3"/>
    <g fill="#2e8b45">
      <ellipse cx="0" cy="-30" rx="12" ry="26"/>
      <ellipse cx="26" cy="15" rx="12" ry="26" transform="rotate(120 26 15)"/>
      <ellipse cx="-26" cy="15" rx="12" ry="26" transform="rotate(240 -26 15)"/>
    </g>
    <circle r="11" fill="#ffffff" stroke="#2e8b45" stroke-width="3"/>
  </g>

  <!-- trois etapes -->
  <g>
    <rect x="474" y="440" width="382" height="88" rx="10" fill="#ffffff" stroke="#cfe4d6" stroke-width="1.5"/>
    <rect x="490" y="462" width="44" height="44" rx="8" fill="#eef7f0"/>
    <path d="M502,478 l8,6 -8,6 M518,490 h10" stroke="#2e8b45" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="552" y="480" font-size="16.5" font-weight="600" fill="#1d5c31">Reads the request</text>
    <text x="552" y="504" font-size="14" fill="#5f8a6d">understands it and gives it structure</text>

    <rect x="474" y="546" width="382" height="88" rx="10" fill="#ffffff" stroke="#cfe4d6" stroke-width="1.5"/>
    <rect x="490" y="568" width="44" height="44" rx="8" fill="#eef7f0"/>
    <path d="M502,596 a9,9 0 0 1 0,-13 l5,-5 M522,584 a9,9 0 0 1 0,13 l-5,5 M507,597 l10,-10" stroke="#2e8b45" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <text x="552" y="586" font-size="16.5" font-weight="600" fill="#1d5c31">Maps it to Heliciel</text>
    <text x="552" y="610" font-size="14" fill="#5f8a6d">translates it into the software's own operations</text>

    <rect x="474" y="652" width="382" height="88" rx="10" fill="#ffffff" stroke="#cfe4d6" stroke-width="1.5"/>
    <rect x="490" y="674" width="44" height="44" rx="8" fill="#eef7f0"/>
    <g transform="translate(512,696)" stroke="#2e8b45" stroke-width="2.2" fill="none">
      <circle r="6.5"/>
      <path d="M0,-12 v-4 M0,12 v4 M-12,0 h-4 M12,0 h4 M-8.5,-8.5 l-3,-3 M8.5,8.5 l3,3 M8.5,-8.5 l3,-3 M-8.5,8.5 l-3,3" stroke-linecap="round"/>
    </g>
    <text x="552" y="692" font-size="16.5" font-weight="600" fill="#1d5c31">Runs it and returns the result</text>
    <text x="552" y="716" font-size="14" fill="#5f8a6d">drives Heliciel and sends the data back</text>
  </g>

  <!-- protocole -->
  <g transform="translate(0,800)">
    <g transform="translate(474,0)" stroke="#2e8b45" stroke-width="2.4" fill="none">
      <rect x="-9" y="-4" width="18" height="14" rx="3"/>
      <path d="M-5,-4 v-5 a5,5 0 0 1 10,0 v5"/>
    </g>
    <g transform="translate(856,0)" stroke="#2e8b45" stroke-width="2.4" fill="none">
      <rect x="-9" y="-4" width="18" height="14" rx="3"/>
      <path d="M-5,-4 v-5 a5,5 0 0 1 10,0 v5"/>
    </g>
    <line x1="492" y1="3" x2="556" y2="3" stroke="#2e8b45" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="774" y1="3" x2="838" y2="3" stroke="#2e8b45" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="665" y="0" text-anchor="middle" font-size="16" font-weight="600" fill="#22703a">MCP protocol</text>
    <text x="665" y="22" text-anchor="middle" font-size="13.5" fill="#5f8a6d">open standard &#8212; OAuth 2.0 + PKCE</text>
  </g>

  <!-- ================= Fleche droite ================= -->
  <line x1="898" y1="450" x2="952" y2="450" stroke="#2e8b45" stroke-width="3" marker-end="url(#fleche-vert)"/>

  <!-- ================= Colonne 3 : Heliciel ================= -->
  <rect x="960" y="140" width="500" height="620" rx="14" fill="#f5f9fd" stroke="#c2d8ec" stroke-width="1.5"/>
  <text x="1210" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#1a4f8a" letter-spacing="0.5">HELICIEL</text>
  <text x="1210" y="212" text-anchor="middle" font-size="15" fill="#5b7897">Propeller, wing and turbine design software</text>

  <!-- fenetre schematique : AUCUN chiffre, AUCUNE courbe d apparence reelle -->
  <rect x="992" y="240" width="436" height="368" rx="8" fill="#ffffff" stroke="#a9c6e0" stroke-width="1.5"/>
  <rect x="992" y="240" width="436" height="28" rx="8" fill="#dcebf9"/>
  <rect x="992" y="258" width="436" height="10" fill="#dcebf9"/>
  <circle cx="1010" cy="254" r="4" fill="#8fb2d2"/>
  <circle cx="1024" cy="254" r="4" fill="#8fb2d2"/>
  <circle cx="1038" cy="254" r="4" fill="#8fb2d2"/>
  <text x="1056" y="259" font-size="12.5" fill="#5b7897">Heliciel &#8212; project, geometry, performance</text>

  <!-- helice schematique -->
  <g transform="translate(1210,392)">
    <g fill="#9fb8cc" opacity="0.95">
      <ellipse cx="0" cy="-52" rx="19" ry="46"/>
      <ellipse cx="45" cy="26" rx="19" ry="46" transform="rotate(120 45 26)"/>
      <ellipse cx="-45" cy="26" rx="19" ry="46" transform="rotate(240 -45 26)"/>
    </g>
    <circle r="19" fill="#c9d8e5" stroke="#7e9cb6" stroke-width="2"/>
    <line x1="0" y1="0" x2="96" y2="0" stroke="#4caf50" stroke-width="2.4"/>
    <line x1="0" y1="0" x2="0" y2="-84" stroke="#2c6fb5" stroke-width="2.4"/>
    <text x="102" y="5" font-size="13" fill="#4caf50" font-weight="600">X</text>
    <text x="-6" y="-92" font-size="13" fill="#2c6fb5" font-weight="600">Z</text>
  </g>

  <!-- barres schematiques, sans valeurs -->
  <g fill="#c2d8ec">
    <rect x="1024" y="540" width="20" height="34" rx="3"/>
    <rect x="1054" y="524" width="20" height="50" rx="3"/>
    <rect x="1084" y="532" width="20" height="42" rx="3"/>
    <rect x="1114" y="512" width="20" height="62" rx="3"/>
  </g>
  <g fill="#cfe4d6">
    <rect x="1188" y="530" width="20" height="44" rx="3"/>
    <rect x="1218" y="514" width="20" height="60" rx="3"/>
    <rect x="1248" y="536" width="20" height="38" rx="3"/>
    <rect x="1278" y="522" width="20" height="52" rx="3"/>
  </g>
  <rect x="1340" y="512" width="68" height="62" rx="4" fill="#eef4fa" stroke="#c2d8ec" stroke-width="1.2"/>
  <path d="M1350,562 L1364,536 L1378,548 L1398,522" fill="none" stroke="#8fb2d2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1210" y="596" text-anchor="middle" font-size="12" fill="#93a9bd" font-style="italic">schematic &#8212; not actual results</text>

  <text x="1210" y="646" text-anchor="middle" font-size="15" fill="#5b7897">The result lands in Heliciel itself:</text>
  <text x="1210" y="670" text-anchor="middle" font-size="15" fill="#5b7897">project, blade geometry, performance, exports</text>
  <text x="1210" y="712" text-anchor="middle" font-size="14.5" fill="#42607f" font-weight="600">Every number comes from a BEM computation,</text>
  <text x="1210" y="734" text-anchor="middle" font-size="14.5" fill="#42607f" font-weight="600">never from the model's guess.</text>

  <!-- ================= Barre du bas ================= -->
  <rect x="230" y="856" width="1040" height="122" rx="14" fill="#ffffff" stroke="#d5e2ee" stroke-width="1.5"/>
  <text x="750" y="890" text-anchor="middle" font-size="15.5" fill="#5b7897">What you can ask for</text>

  <g font-size="13.5" fill="#3d5b78" text-anchor="middle">
    <g transform="translate(348,928)">
      <g fill="#2e8b45" transform="translate(0,-8) scale(0.62)">
        <ellipse cx="0" cy="-17" rx="7" ry="15"/>
        <ellipse cx="15" cy="9" rx="7" ry="15" transform="rotate(120 15 9)"/>
        <ellipse cx="-15" cy="9" rx="7" ry="15" transform="rotate(240 -15 9)"/>
      </g>
      <text y="32">Design a propeller</text>
    </g>
    <g transform="translate(548,928)">
      <g stroke="#2c6fb5" stroke-width="2.2" fill="none" stroke-linecap="round" transform="translate(0,-8)">
        <line x1="-14" y1="-7" x2="14" y2="-7"/><circle cx="4" cy="-7" r="4" fill="#ffffff"/>
        <line x1="-14" y1="7" x2="14" y2="7"/><circle cx="-6" cy="7" r="4" fill="#ffffff"/>
      </g>
      <text y="32">Change diameter</text>
      <text y="50">or blade count</text>
    </g>
    <g transform="translate(750,928)">
      <g fill="#2c6fb5" transform="translate(0,-8)">
        <rect x="-14" y="0" width="7" height="12" rx="1.5"/>
        <rect x="-3.5" y="-8" width="7" height="20" rx="1.5"/>
        <rect x="7" y="-15" width="7" height="27" rx="1.5"/>
      </g>
      <text y="32">Optimize efficiency</text>
    </g>
    <g transform="translate(950,928)">
      <g stroke="#2c6fb5" stroke-width="2.2" fill="none" stroke-linejoin="round" transform="translate(0,-8)">
        <path d="M-10,-14 h13 l8,8 v20 h-21 Z"/>
        <path d="M3,-14 v8 h8"/>
      </g>
      <text y="32">Export STL,</text>
      <text y="50">IGES or data</text>
    </g>
    <g transform="translate(1152,928)">
      <g stroke="#2c6fb5" stroke-width="2.2" fill="none" transform="translate(0,-8)">
        <ellipse cx="0" cy="-11" rx="13" ry="5"/>
        <path d="M-13,-11 v18 a13,5 0 0 0 26,0 v-18"/>
        <path d="M-13,-2 a13,5 0 0 0 26,0"/>
      </g>
      <text y="32">Compare variants</text>
    </g>
  </g>

  <text x="750" y="1000" text-anchor="middle" font-size="13" fill="#93a9bd">mcp.heliciel.com &#8212; Mecaflux / Heliciel, fluid-mechanics software since 2005</text>
</svg>
